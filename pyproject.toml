[project]
name = "steganography"
version = "0.1.0"
description = "Hide a message image inside a cover image using pixel value threshold steganography"
requires-python = ">=3.10"
dependencies = [
    "pillow>=11.0",
]

[project.scripts]
steg = "steg:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["steg.py"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
exclude = ["legacy"]

